<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieRec - 电影推荐与评价系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <div class="nav-brand" onclick="navigateTo('home')">MovieRec</div>
            <div class="nav-search" id="navSearchBox">
                <input type="text" id="navSearchInput" placeholder="搜索电影..." onkeydown="if(event.key==='Enter')performSearch()">
                <button onclick="performSearch()" class="btn-search">🔍</button>
            </div>
            <div class="nav-links">
                <a href="#movies" onclick="navigateTo('movies')">电影库</a>
                <a href="#recommendations" onclick="navigateTo('recommendations')">推荐</a>
                <a href="#ai" onclick="navigateTo('ai')">AI助手</a>
                <a href="#admin" id="navAdminLink" style="display:none" onclick="navigateTo('admin')">管理</a>
            </div>
            <div class="nav-user" id="navUser">
                <button class="btn-login" onclick="showAuthModal('login')">登录</button>
                <button class="btn-register" onclick="showAuthModal('register')">注册</button>
            </div>
            <div class="nav-user-logged-in" id="navUserLoggedIn" style="display:none">
                <div class="user-dropdown">
                    <span class="user-avatar" onclick="toggleUserMenu()" id="userMenuTrigger">👤</span>
                    <span id="navUsername"></span>
                    <div class="dropdown-menu" id="userDropdown" style="display:none">
                        <a href="#" onclick="navigateTo('profile')">个人中心</a>
                        <a href="#" onclick="logout()">退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
        <!-- Home -->
        <section id="page-home" class="page">
            <div class="hero">
                <h1 class="hero-title">发现你的下一部<br>心爱电影</h1>
                <p class="hero-subtitle">智能推荐 · 真实评价 · AI助力</p>
                <button class="btn-hero" onclick="navigateTo('movies')">开始探索</button>
            </div>
            <div class="home-featured" id="homeFeatured"></div>
        </section>

        <!-- Movies -->
        <section id="page-movies" class="page" style="display:none">
            <div class="movies-layout">
                <aside class="movies-sidebar">
                    <h3>筛选条件</h3>
                    <div class="filter-group">
                        <label>类型（多选）</label>
                        <div class="filter-genres" id="filterGenres"></div>
                    </div>
                    <div class="filter-group">
                        <label>评分区间</label>
                        <div class="filter-range">
                            <input type="number" id="filterRatingMin" placeholder="最低分" min="0" max="10" step="0.5">
                            <span>—</span>
                            <input type="number" id="filterRatingMax" placeholder="最高分" min="0" max="10" step="0.5">
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>年份区间</label>
                        <div class="filter-range">
                            <input type="number" id="filterYearFrom" placeholder="起始年份" min="1900" max="2030">
                            <span>—</span>
                            <input type="number" id="filterYearTo" placeholder="结束年份" min="1900" max="2030">
                        </div>
                    </div>
                    <button class="btn-filter-apply" onclick="applyMovieFilters()">应用筛选</button>
                    <button class="btn-filter-reset" onclick="resetMovieFilters()">重置</button>
                </aside>
                <div class="movies-main">
                    <div class="movies-grid" id="moviesGrid"></div>
                    <div class="pagination" id="moviesPagination"></div>
                </div>
            </div>
        </section>

        <!-- Movie Detail -->
        <section id="page-movie-detail" class="page" style="display:none">
            <div class="movie-detail" id="movieDetail"></div>
        </section>

        <!-- Recommendations -->
        <section id="page-recommendations" class="page" style="display:none">
            <h2 class="page-title">为你推荐</h2>
            <div class="movies-grid" id="recommendationsGrid"></div>
        </section>

        <!-- AI Assistant - Unified Chat -->
        <section id="page-ai" class="page" style="display:none">
            <h2 class="page-title">AI 助手</h2>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-message assistant">
                        <div class="chat-avatar">🤖</div>
                        <div class="chat-bubble">
                            你好！我是 MovieRec AI 助手 🎬<br><br>
                            我可以帮你：<br>
                            • 推荐电影 — 告诉我你的喜好<br>
                            • 回答电影问题 — 剧情、评分、年份等<br>
                            • 分析评论情感 — 你觉得一部电影怎么样？<br>
                            • 其他问题也可以问我哦～<br><br>
                            <span style="color:var(--text-secondary);font-size:0.85rem;">试试说「推荐一部科幻片」或「肖申克的救赎评分多少」</span>
                        </div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <textarea id="chatInput" rows="1" placeholder="输入你的问题..." onkeydown="handleChatKeydown(event)"></textarea>
                    <button class="btn-chat-send" onclick="sendChatMessage()"><span>发送</span><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
                </div>
            </div>
        </section>

        <!-- Profile -->
        <section id="page-profile" class="page" style="display:none">
            <h2 class="page-title">个人中心</h2>
            <div class="profile-container" id="profileContent"></div>
        </section>

        <!-- Admin -->
        <section id="page-admin" class="page" style="display:none">
            <h2 class="page-title">管理后台</h2>
            <div class="admin-container">
                <div class="admin-tabs">
                    <button class="admin-tab active" onclick="switchAdminTab('users')">用户管理</button>
                    <button class="admin-tab" onclick="switchAdminTab('movies')">电影管理</button>
                    <button class="admin-tab" onclick="switchAdminTab('comments')">评论管理</button>
                </div>
                <div id="adminPanelUsers" class="admin-panel">
                    <table class="admin-table" id="adminUsersTable"></table>
                </div>
                <div id="adminPanelMovies" class="admin-panel" style="display:none">
                    <button class="btn-submit" style="width:auto;margin-bottom:12px;" onclick="showMovieForm()">+ 添加电影</button>
                    <table class="admin-table" id="adminMoviesTable"></table>
                </div>
                <div id="adminPanelComments" class="admin-panel" style="display:none">
                    <table class="admin-table" id="adminCommentsTable"></table>
                </div>
            </div>
        </section>
    </main>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal" style="display:none">
        <div class="modal-card">
            <span class="modal-close" onclick="closeAuthModal()">&times;</span>
            <h2 id="authModalTitle">登录</h2>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group" id="authEmailGroup" style="display:none">
                    <label>邮箱</label>
                    <input type="email" id="authEmail" placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="authUsername" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="authPassword" placeholder="请输入密码" required minlength="6">
                </div>
                <div class="form-group" id="authGenresGroup" style="display:none">
                    <label>偏好类型（多选）</label>
                    <div class="checkbox-group" id="authGenresCheckboxes"></div>
                </div>
                <button type="submit" class="btn-submit" id="authSubmitBtn">登录</button>
            </form>
            <p class="auth-switch" id="authSwitch">
                还没有账号？<a href="#" onclick="switchAuthMode('register')">立即注册</a>
            </p>
        </div>
    </div>

    <!-- Movie Form Modal (Admin) -->
    <div class="modal-overlay" id="movieFormModal" style="display:none">
        <div class="modal-card" style="width:520px;">
            <span class="modal-close" onclick="closeMovieForm()">&times;</span>
            <h2 id="movieFormTitle">添加电影</h2>
            <form id="movieForm" onsubmit="saveMovie(event)">
                <input type="hidden" id="movieFormId">
                <div class="form-group">
                    <label>电影名称</label>
                    <input type="text" id="movieTitle" placeholder="请输入电影名称" required>
                </div>
                <div class="form-group">
                    <label>简介</label>
                    <textarea id="movieDescription" placeholder="请输入电影简介" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>上映年份</label>
                    <input type="number" id="movieYear" placeholder="如：2024" min="1900" max="2030">
                </div>
                <div class="form-group">
                    <label>封面图片URL</label>
                    <input type="text" id="movieCover" placeholder="https://...（可选，留空使用默认图片）">
                </div>
                <div class="form-group">
                    <label>类型（多选）</label>
                    <div class="checkbox-group" id="movieGenresCheckboxes">
                        <label><input type="checkbox" value="动作"><span>动作</span></label>
                        <label><input type="checkbox" value="喜剧"><span>喜剧</span></label>
                        <label><input type="checkbox" value="剧情"><span>剧情</span></label>
                        <label><input type="checkbox" value="科幻"><span>科幻</span></label>
                        <label><input type="checkbox" value="爱情"><span>爱情</span></label>
                        <label><input type="checkbox" value="犯罪"><span>犯罪</span></label>
                        <label><input type="checkbox" value="悬疑"><span>悬疑</span></label>
                        <label><input type="checkbox" value="动画"><span>动画</span></label>
                        <label><input type="checkbox" value="奇幻"><span>奇幻</span></label>
                        <label><input type="checkbox" value="冒险"><span>冒险</span></label>
                        <label><input type="checkbox" value="战争"><span>战争</span></label>
                        <label><input type="checkbox" value="历史"><span>历史</span></label>
                        <label><input type="checkbox" value="音乐"><span>音乐</span></label>
                        <label><input type="checkbox" value="灾难"><span>灾难</span></label>
                        <label><input type="checkbox" value="家庭"><span>家庭</span></label>
                        <label><input type="checkbox" value="恐怖"><span>恐怖</span></label>
                    </div>
                </div>
                <button type="submit" class="btn-submit">保存</button>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- JS modules: order matters — later files depend on earlier ones -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/router.js"></script>
    <script src="/static/js/movies.js"></script>
    <script src="/static/js/recommendations.js"></script>
    <script src="/static/js/ai.js"></script>
    <script src="/static/js/profile.js"></script>
    <script src="/static/js/admin.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
